<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6a5cff"/>
      <stop offset="1" stop-color="#3b2fd4"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe45c"/>
      <stop offset="0.65" stop-color="#ffcf24"/>
      <stop offset="1" stop-color="#f2b90d"/>
    </linearGradient>
    <linearGradient id="beak" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffab3a"/>
      <stop offset="1" stop-color="#ef7f10"/>
    </linearGradient>
  </defs>

  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#bg)"/>
  <ellipse cx="512" cy="800" rx="268" ry="42" fill="#000" opacity="0.20"/>

  <!-- клюв ПОД силуэтом головы: торчит вправо, голова его перекрывает -->
  <g stroke="#141414" stroke-width="22" stroke-linejoin="round">
    <path d="M 700 370
             C 780 340, 860 348, 896 384
             C 912 400, 906 420, 882 430
             C 828 452, 756 452, 706 432 Z" fill="url(#beak)"/>
    <path d="M 716 428 C 776 448, 844 446, 890 424" fill="none" stroke="#141414" stroke-width="14" stroke-linecap="round"/>
  </g>

  <!-- ===== цельный силуэт: голова + тело + хвостик ===== -->
  <path d="M 560 238
           C 652 230, 730 290, 742 376
           C 748 424, 732 468, 700 498
           C 742 532, 768 588, 768 646
           C 768 738, 672 792, 545 792
           C 432 792, 334 754, 307 674
           C 297 644, 298 618, 307 594
           C 270 576, 243 548, 230 508
           C 262 514, 290 514, 313 506
           C 296 484, 288 462, 288 440
           C 322 462, 356 470, 385 464
           C 398 452, 410 445, 422 440
           C 430 355, 453 291, 508 256
           C 524 246, 542 240, 560 238 Z"
        fill="url(#body)" stroke="#141414" stroke-width="26" stroke-linejoin="round"/>

  <!-- крыло -->
  <path d="M 430 588
           C 502 550, 584 560, 626 612
           C 600 670, 530 698, 466 682
           C 418 670, 405 622, 430 588 Z"
        fill="#f0b40a" stroke="#141414" stroke-width="22" stroke-linejoin="round"/>

  <!-- глаз -->
  <circle cx="640" cy="356" r="40" fill="#141414"/>
  <circle cx="654" cy="342" r="13" fill="#ffffff"/>

  <!-- блики -->
  <path d="M 535 290 C 566 270, 606 264, 642 274" fill="none" stroke="#ffffff" stroke-width="18" stroke-linecap="round" opacity="0.6"/>
  <path d="M 356 700 C 404 736, 472 752, 540 752" fill="none" stroke="#ffffff" stroke-width="16" stroke-linecap="round" opacity="0.35"/>
</svg>
