<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6a5cff"/>
      <stop offset="1" stop-color="#3b2fd4"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffdf4d"/>
      <stop offset="1" stop-color="#f7c718"/>
    </linearGradient>
    <linearGradient id="beak" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff9d2e"/>
      <stop offset="1" stop-color="#f07f12"/>
    </linearGradient>
  </defs>

  <!-- фон: macOS squircle -->
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#bg)"/>

  <!-- мягкая тень -->
  <ellipse cx="512" cy="812" rx="270" ry="44" fill="#000" opacity="0.22"/>

  <!-- ===== утка в профиль (смотрит вправо) ===== -->
  <g stroke="#141414" stroke-width="26" stroke-linejoin="round" stroke-linecap="round">
    <!-- хвостик -->
    <path d="M 330 600 Q 250 540 268 470 Q 320 512 366 520 Z" fill="url(#body)"/>
    <!-- тело -->
    <path d="M 300 640
             Q 300 540 400 522
             L 560 500
             Q 700 490 716 600
             Q 726 700 640 748
             Q 560 790 452 782
             Q 330 770 300 640 Z" fill="url(#body)"/>
    <!-- крыло -->
    <path d="M 420 600
             Q 520 560 600 610
             Q 560 690 470 692
             Q 408 690 402 646
             Q 400 618 420 600 Z" fill="#f0b90a"/>
    <!-- шея+голова -->
    <path d="M 520 560
             Q 500 420 560 340
             Q 600 286 664 292
             Q 742 300 754 380
             Q 762 448 706 480
             Q 664 502 648 560 Z" fill="url(#body)"/>
    <!-- клюв -->
    <path d="M 742 356
             Q 830 352 872 386
             Q 890 402 866 416
             Q 812 444 748 436 Z" fill="url(#beak)"/>
    <!-- нижняя створка клюва -->
    <path d="M 748 436 Q 800 452 838 438 Q 812 478 756 470 Z" fill="#e06d0a"/>
  </g>

  <!-- глаз -->
  <circle cx="676" cy="376" r="34" fill="#141414"/>
  <circle cx="688" cy="364" r="11" fill="#ffffff"/>

  <!-- блик на голове -->
  <path d="M 590 340 Q 620 306 660 306" fill="none" stroke="#fff" stroke-width="16" stroke-linecap="round" opacity="0.55"/>
</svg>
